[project]
name = "mcp-read-only-argocd"
version = "0.4.0"
description = "MCP server for read-only access to Argo CD instances using browser session cookies"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["argocd", "mcp", "mcp-server", "read-only", "kubernetes"]
authors = [
    {name = "Lukas Lehner", email = "lehner.lukas@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # The server builds on mcp.server.mcpserver (the 2.x successor to FastMCP).
    # Capped below 3 so the next major SDK rewrite cannot silently break installs
    # the way 2.0.0 did when it removed mcp.server.fastmcp.
    "mcp>=2.0.0,<3",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "browser-cookie3>=0.20.1",
    "ruamel-yaml>=0.19.1",
]

[project.urls]
Homepage = "https://github.com/lukleh/mcp-read-only-argocd"
Repository = "https://github.com/lukleh/mcp-read-only-argocd"
Issues = "https://github.com/lukleh/mcp-read-only-argocd/issues"
Changelog = "https://github.com/lukleh/mcp-read-only-argocd/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-timeout>=2.2.0",
    "pytest-asyncio>=0.21.0",
    # Cap ruff to one minor: the implicit default rule set changes between
    # minors (0.16 widened it), so a routine relock must not change lint
    # behavior. Bumping the cap is a deliberate, separate change.
    "ruff>=0.16,<0.17",
    "ty>=0.0.28",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mcp-read-only-argocd = "mcp_read_only_argocd.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_read_only_argocd"]

[tool.ruff.lint]
# The tree follows ruff 0.16's implicit default rule set (deterministic
# because the dev extra caps ruff to the 0.16 minor). Deliberate opt-outs:
#   BLE001 - broad `except Exception` at the MCP tool boundary is this
#            server's design; exceptions propagate to the framework
#   TRY004 - raised exception types are observable API behavior; changing
#            them is out of scope for lint
ignore = ["BLE001", "TRY004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (require live Argo CD instance)",
    "unit: marks tests as unit tests (no external dependencies)",
]

[tool.vulture]
paths = ["src", "tests", "smoke_test.py"]
exclude = [".venv", "venv", "build", "dist", "node_modules", "__pycache__", "site-packages"]
ignore_decorators = ["@*.tool*", "@pytest.fixture", "@field_validator", "@model_validator", "@validator"]
ignore_names = ["model_config", "pytest_*"]
min_confidence = 80

[tool.ty.src]
include = ["src"]
